# ---------------------------------------------------------------------------
# PerfLab — Crucible target service
# Baseline configuration. NO bottleneck is injected in this file.
# The Crucible agent may only tune the properties listed in DESIGN.md
# section 5 (Change applicator authority boundary).
# ---------------------------------------------------------------------------

spring.application.name=perf-lab
server.port=8080

# --- Version endpoint metadata ---
perflab.version=0.1.0

# --- Datasource: H2 in-memory (zero-config for the spike) ---
spring.datasource.url=jdbc:h2:mem:perflab;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# --- HikariCP connection pool ---
# BASELINE pool size = 10. Bottleneck injection sets this to 2.
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.pool-name=perflab-pool
spring.datasource.hikari.register-mbeans=true

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# --- H2 console (debug convenience, not required) ---
spring.h2.console.enabled=true

# --- Tomcat request threads (baseline; thread-pool bottleneck sets max=4) ---
server.tomcat.threads.max=200
server.tomcat.threads.min-spare=10

# --- Spring task executor (baseline; async bottleneck tunes these) ---
spring.task.execution.pool.core-size=8
spring.task.execution.pool.max-size=16
spring.task.execution.pool.queue-capacity=100

# ---------------------------------------------------------------------------
# Actuator + Micrometer
# Metrics exposed at /actuator/prometheus and /actuator/metrics/{name}
# ---------------------------------------------------------------------------
management.endpoints.web.exposure.include=health,info,metrics,prometheus,env
management.endpoint.health.show-details=always
management.prometheus.metrics.export.enabled=true

# Always keep these metric families available:
#   hikaricp.*  jvm.gc.*  jvm.memory.*  jvm.threads.*  http.server.requests  executor.*
management.metrics.enable.hikaricp=true
management.metrics.enable.jvm=true
management.metrics.enable.http=true
management.metrics.enable.executor=true
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.percentiles.http.server.requests=0.5,0.95,0.99
management.metrics.tags.application=perf-lab
