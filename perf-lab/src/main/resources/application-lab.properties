# ---------------------------------------------------------------------------
# PerfLab -- the `lab` profile: the real dependency stack.
#
#   ./mvnw spring-boot:run -Dspring-boot.run.profiles=lab
#
# Requires the containers in perf-lab/docker-compose.yml (Postgres, Redis,
# httpbin). The default profile stays on H2 with no cache and no downstream so
# the app starts with nothing running -- that matters for CI and for a laptop.
#
# Baseline values only. NO bottleneck is injected in this file; a fixture is
# created by overriding one property, so that the difference between a healthy
# and an unhealthy run is exactly one line.
# ---------------------------------------------------------------------------

# --- Datasource: Postgres ---
# Percentiles from H2 are not representative: an in-memory engine returns in
# microseconds, so nothing ever queues and every fixture needs a fake sleep to
# work at all. Postgres is what the cloud box runs and what the numbers should
# come from.
spring.datasource.url=jdbc:postgresql://localhost:5432/perflab
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=perflab
spring.datasource.password=perflab

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=create-drop

spring.h2.console.enabled=false

# --- Cache: Redis ---
spring.cache.type=redis
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.cache.redis.time-to-live=60s

# --- Downstream: httpbin ---
perflab.downstream.base-url=http://localhost:8081
