# Capability tiers.
#
# A tier is a NAME plus the gateway request fields that name expands to. Nothing
# in crucible knows any of these names, providers or models: add a tier, rename a
# tier, or repoint one at a different provider entirely by editing this file.
#
# `order` is the ladder, cheapest first. `policy.py` walks it downwards when the
# run is under budget pressure, so the order is the only thing that defines what
# "downgrade" means.

order: [economy, standard]
default_tier: standard

# ── The ladder is CROSS-MODEL ────────────────────────────────────────────────
# The first version of this file varied reasoning effort and the output ceiling
# on ONE model. The arithmetic worked — output is billed 6x input, so capping
# max_tokens does cap spend — but it made "model routing" only half-true: every
# rung of the ladder was the same model, so a downgrade could never be a change
# of model, only a change of how hard that one model was allowed to think.
#
# Each rung below is a DIFFERENT model on a DIFFERENT provider, and the three
# were measured against glc_v4 on 2026-07-30 before being written down. One
# identical 3-sentence prompt, max_tokens 512, temperature 0, reasoning off:
#
#   rung      provider    model                    $/Mtok in/out  latency  answered
#   economy   groq        openai/gpt-oss-120b      0.15 / 0.75    0.74 s   yes
#   standard  gemini      gemini-3.1-flash-lite    0.25 / 1.50    1.24 s   yes
#   frontier  github      openai/gpt-4.1           2.00 / 8.00    2.88 s   yes
#
# Input rate, output rate and latency all rise monotonically along the ladder,
# which is what makes "one rung down" unambiguous. Projected worst-case cost per
# call (the number admission actually uses) is $0.000564 / $0.002161 / $0.044768
# — a 79x spread across the ladder, where the same-model ladder managed 5x.
#
# NOTE, 11 September 2026. The table above is the 2026-07-30 measurement and is
# left exactly as measured -- it is a record of what was observed, not a
# statement about today. Two things have since changed and the `tiers` block
# below reflects them, not the table:
#
#   - gemini moved from gemini-3.1-flash-lite to gemini-3.5-flash-lite, which
#     glc_v5 prices at 0.20 / 1.20 rather than the 0.25 / 1.50 measured above.
#   - `github` no longer provides an API, so the frontier rung's provider is
#     gone. glc_v5 does not load a `github` provider at all, which means a
#     frontier request currently fails with 400 unknown provider -- and
#     role_tiers maps `planner` to frontier, so planner calls fail with it.
#     UNRESOLVED: nothing glc_v5 can currently reach scores above gemini
#     (quality 0.66), so a three-rung ascending ladder is not expressible
#     until a direct provider is added (DESIGN.md section 16 allows one).

# Two facts worth keeping, both learned the hard way:
#
#   `reasoning: "off"` is not decoration on the cheap rung. gpt-oss-120b thinks
#   by default: at max_tokens 128 with the dial left alone it spent all 128
#   output tokens in its reasoning channel and returned content "" — a fully
#   billed non-answer. The same call with the dial off returned a 570-character
#   answer in 117 tokens. glc_v4's providers.py now translates "off" into the
#   dialect each server understands; the tier only has to ask.
#
#   The cheapest rung is deliberately NOT free. This gateway can also reach
#   ollama/gemma4:31b and openrouter's nvidia/nemotron-3-super-120b-a12b:free at
#   $0.00/Mtok, and either would be a legitimate rung — but a rung that costs
#   nothing cannot be exhausted by a dollar ceiling, so "refuse at exhaustion"
#   stops being expressible in dollars and falls entirely to max_calls_per_run.
#   A free rung wants a call-count budget, not a money budget. Local weights are
#   also slow: gemma4:31b took 39.6 s (and 86.4 s under load) for the same
#   prompt the frontier rung answered in 2.9 s, so the cheapest rung on a price
#   ladder is not the cheapest rung on a latency ladder.

# THE LADDER IS TWO RUNGS, NOT THREE, as of 12 September 2026.
#
# The third rung has no occupant. Every candidate was tried and MEASURED:
#
#   github / openai/gpt-4.1   GitHub no longer serves an API; glc_v5 does not
#                             load the provider, so the rung returned
#                             400 unknown provider on every call.
#   cerebras / qwen-3.8-27b   Announced on "Cerebras PayGo" with a per-token
#                             price; free-tier entitlement unconfirmed, and
#                             DESIGN.md section 16 constrains us to free tier.
#   openrouter (free models)  Genuinely $0, but glc_v5 meters openrouter at
#                             50 requests PER DAY against gemini's 5000. Too
#                             scarce for a rung the planner would touch.
#   nvidia / deepseek-v4      MEASURED 12 Sep 2026, 10 consecutive calls:
#     -flash-0731             1 succeeded (1.01 s), 1 hung 180 s and returned
#                             502, and that single failure benched the provider
#                             for 600 s, killing the remaining 8. The model
#                             itself answers correctly when it answers; the
#                             endpoint is not dependable enough for a rung.
#
# So the ladder is groq -> gemini: both measured, both priced, both reliable,
# and cost still rises along it. Adding a third rung later is a config edit;
# pricing rows for the rejected candidates are kept in pricing.yaml so the
# measurements are not lost.

tiers:
  economy:
    # Every key under `request` is merged verbatim into the gateway's /v1/chat
    # body. That is the whole tier -> provider mapping: no Python edit needed to
    # change a provider, a model, a reasoning effort or a token ceiling.
    request:
      provider: groq
      model: openai/gpt-oss-120b
      reasoning: "off"
      max_tokens: 512
      temperature: 0
    # Which row of pricing.yaml this tier is billed against. Defaults to the
    # request model when omitted.
    price_model: openai/gpt-oss-120b
    # What the estimator assumes before the call returns, in tokens. Real usage
    # replaces this the moment the response lands.
    projected_input_tokens: 1200
    projected_output_tokens: 400

  standard:
    request:
      provider: gemini
      model: gemini-3.5-flash-lite
      reasoning: "off"
      max_tokens: 1024
      temperature: 0
    price_model: gemini-3.5-flash-lite
    projected_input_tokens: 2500
    projected_output_tokens: 800

# Which tier a graph ROLE asks for. Keys are the runtime's own skill/role names
# (never task content), so a node "declares the tier it needs" by declaring its
# role. `default` covers every role not listed.
role_tiers:
  default: standard
  # planner moved off frontier on 11 September 2026. Two reasons, both evidence
  # rather than preference:
  #   - gemini is the only model on this ladder whose quality has been MEASURED
  #     here (0.66, vs groq 0.60; the openrouter free rung is unrated). Putting
  #     the planner on an unmeasured model is a capability claim we cannot make.
  #   - frontier is metered at 50 requests/day by glc_v5, against gemini's 5000
  #     (1000 x 5 keys). The planner runs for every task graph, so it is the
  #     worst possible role to put on the scarcest rung.
  planner: standard
  memory_recall: economy
  remember_explicit_fact: economy
  web_search: economy
  fetch_url: economy
  index_file: economy
  list_directory: economy
  read_file: economy
  write_file: economy
  copy_file: economy
  file_sha256: economy
  verify_artifact: economy
  calculate: economy
  query_csv: economy
  current_datetime: economy
  date_shift: economy
  create_calendar_events: economy
  a2a_delegate: economy
  researcher: economy
  retriever: economy
  summariser: economy
  formatter: economy
  distiller: standard
  content: standard
  coder_validator: standard
  compose_surface: standard
  answer_with_evidence: standard
