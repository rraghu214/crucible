# ---------------------------------------------------------------------------
# perflab_gc_pressure -- the lookalike.
#
# GC pauses and pool exhaustion produce the same surface signature: p99 spikes
# while p50 stays flat (assertion 4.2). That is the entire reason this fixture
# exists. An agent that reads the shape and reaches for the pool passes T1 and
# fails here, and outcome-only scoring would never see the difference -- on a
# JVM under memory pressure a larger pool can even move p99 in the right
# direction, which is a LUCKY result recorded as a success (DESIGN.md §4.7).
# ---------------------------------------------------------------------------

id: perflab_gc_pressure
target_profile: spring-boot
ground_truth_cause_family: gc_pressure
severity: severe

# The heap, set through perflab.jvm.heap-max-mb in application.properties (Box A's
# deploy hook turns it into -Xmx). Until 1 November 2026 this was a bare JVM flag
# the agent could not touch; it is now an allowed property, so the fixture's
# state is set the same way the agent would undo it.
bottleneck_config:
  perflab.jvm.heap-max-mb: 128
  endpoint: /api/churn

setup: >
  Start perf-lab with -Xmx128m and drive /api/churn, the allocation-heavy
  endpoint, at 50 users. The small heap plus sustained allocation keeps the
  collector busy: gc_pause_count climbs steadily and heap_used_peak_bytes sits
  near the ceiling, while the HikariCP fields stay entirely ordinary.

# The second multi-provider fixture, and it is the one that catches a different
# class of error from perflab_pool_starved's. That fixture proves the three
# adapters agree about HikariCP; this one proves they agree about the JVM, and
# the JVM mappings are where the profile is most likely to be wrong:
# `jvm.memory.used` is the only entry in the file needing both a label matcher
# (`area: heap`) and an aggregation, because Micrometer publishes one series per
# memory pool. An adapter that summed non-heap along with heap would report a
# number that is not the thing its name claims, and nothing but a cross-provider
# disagreement would show it.
#
# Both timers here are also unit-converted differently per backend -- seconds
# under Prometheus, nanoseconds under Datadog -- so a per-metric-family naming or
# unit error that survived the pool fixture is caught here.
# The locust tag that selects this fixture's endpoint. One family at a time:
# an untagged run measures a blend of all nine and dilutes the signal to
# nothing (observed on Box A, 26 September 2026).
scenario_tag: churn

providers:
  - actuator
  - promql
  - datadog

# The trap is the pool. Since the heap became an allowed property (1 November
# 2026) the right fix is reachable, so the wrong one is a matter of judgement,
# not the guard: raising maximum-pool-size on a GC-bound service can still move
# p99 a little and would be recorded as a success for the wrong reason -- the
# LUCKY quadrant (DESIGN.md 4.7). Only judgement stops it, which is exactly what
# trap_properties is for.
trap_properties:
  - spring.datasource.hikari.maximum-pool-size

task_classes: [A, B]

validated_at: ""

notes: >
  Watch the collector's max_recent_ms caveat on this fixture specifically.
  Micrometer's MAX is a rolling ~2-minute maximum that decays, so a GC pause
  early in a 300 s window has aged out by the time the window ends -- the
  collector names the field max_recent_ms rather than max_ms for exactly this
  reason, and GC is the cause where the under-reporting bites hardest. The
  count and the mean over the window are the fields that carry the signal here;
  the max is the one that will look smaller than the run felt.
